<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>It's over 9000</title>
        <link rel="stylesheet" href="calc.css">
    </head>
    <body>
        <div class="calculator">
            <input type="text" id="left-member" placeholder="Left number">
            <select id="operator">
                <option value="+">+</option>
                <option value="-">-</option>
                <option value="*">*</option>
                <option value="/">/</option>
                <option value="%">%</option>
            </select>
            <input type="text" id="right-member" placeholder="Right number">
            <input type="submit" id="submit-btn" value="Try me!">
        </div>
        <script src="calc.js"></script>
    </body>
</html>
