<!DOCTYPE html>
<html>
    <head>
        <title>Tab</title>
        <style>
            table {
                width: 100%;
                height: 140px;
                border-collapse: collapse;
                border: 1px solid #000;
            }
            td {
                border: 1px solid #000;
                padding: 10px;
                vertical-align: middle;
                font-family: sans-serif;
                font-size: 16px;
            }
            .first-cell {
                background-color: #279CF5;
                width: 50%;
            }
            .second-cell {
                background-color: #EBED13;
                width: 50%;
            }
        </style>
    </head>
    <body>
        <table>
            <tr>
                <td class="first-cell">Lefty</td>
                <td class="second-cell">Righty</td>
            </tr>
        </table>
    </body>
</html>
