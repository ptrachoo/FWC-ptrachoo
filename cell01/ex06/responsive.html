<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Responsive</title>
        <style>
            html, body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                box-sizing: border-box;
            }
            table {
                width: 100%;
                height: 100%;
                border-collapse: collapse;
                table-layout: fixed;
            }
            td {
                vertical-align: middle;
                font-family: sans-serif;
                font-size: 2vw;
                padding: 10px;
                word-wrap: break-word;
            }
            .first-cell {
                background-color: #279CF5;
                width: 50%;
            }
            .second-cell {
                background-color: #EBED13;
                width: 50%;
            }
        </style>
    </head>
    <body>
        <table>
            <tr>
                <td class="first-cell">Lefty</td>
                <td class="second-cell">Righty</td>
            </tr>
        </table>
    </body>
</html>
