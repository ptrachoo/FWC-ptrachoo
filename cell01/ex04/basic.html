<!DOCTYPE html>
<html>
    <head>
        <title>Basics</title>
        <style>
            body {background-color: pink;}
            h1 {color: white;text-align: center;}
            .shop-container {
                display: flex;
                justify-content: center;
                gap: 50px;
                text-align: center;
                margin-bottom: 20px;
            }
            .shop-item img {
                width: 200px;
                height: 200px;
                object-fit: contain;
                display: block;
                margin: 0 auto 10px auto;
            }
            hr {
                width: 100%;
                border: 1px solid black;
            }

            .footer {
                text-align: right;
                font-style: italic;
                font-family: monospace;
            }
        </style>
    </head>
    <body>
        <h1>Online Shops in Thailand</h1>
        <div class="shop-container">
            <div class="shop-item">
                <img src="https://upload.wikimedia.org/wikipedia/commons/4/4d/Lazada_%282019%29.svg">
                <a href="https://www.lazada.co.th" target="_blank">Visit Lazada</a>
            </div>
            <div class="shop-item">
                <img src="https://upload.wikimedia.org/wikipedia/commons/f/fe/Shopee.svg">
                <a href="https://shopee.co.th" target="_blank">Visit Shopee</a>
            </div>
        </div>
        <hr>
        <p class="footer">&copy; your_login 2026</p>
    </body>
</html>
