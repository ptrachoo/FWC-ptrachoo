<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>User Profile Card</title>
        <link rel="stylesheet" href="card.css">
    </head>
    <body>
        <h1 class="page-title">User Profile Card</h1>
        <div class="card">
            <table class="card-table">
                <tr>
                    <td class="photo-cell">
                        <img class="profile-pic" src="https://i.postimg.cc/kMw925w0/IMG-3647-(1).jpg">
                    </td>
                </tr>
                <tr>
                    <td class="login">Phisitpon Trachoo (Patter,ptrachoo)</td>
                </tr>
                <tr>
                    <td class="subtitle">A blue doggo</td>
                </tr>
                <tr>
                    <td class="location">Thailand</td>
                </tr>
                <tr>
                    <td class="socials">
                        <a href="https://www.linkedin.com/in/phisitpon-trachoo-7931a941b/"><img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/8/81/LinkedIn_icon.svg/1280px-LinkedIn_icon.svg.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=thumbnail"></a>
                        <a href="https://www.facebook.com/shizukana.kou/"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/51/Facebook_f_logo_%282019%29.svg/250px-Facebook_f_logo_%282019%29.svg.png?utm_source=commons.wikimedia.org&utm_campaign=parser&utm_content=thumbnail"></a>
                    </td>
                </tr>
                <tr>
                    <td class="btn-cell">
                        <button class="contact-btn" type="button">Contact</button>
                    </td>
                </tr>
            </table>
        </div>
    </body>
</html>
